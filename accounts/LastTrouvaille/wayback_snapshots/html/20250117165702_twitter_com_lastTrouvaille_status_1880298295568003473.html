<head>

<title>

</title>
<style type="text/css">
body {
				margin:0;
				padding: 20px;
				background-color: #000;
				min-height: 100vh;
				box-sizing: border-box;
			}
  .notice {
    border: 2px solid #c9ae00;
    background-color: #ffff00;
    padding: 12px;
    position: sticky;
    top: 20px;
    z-index: 1000;
  }

  .tweet-container {
    font-family: Helvetica, Arial, sans-serif;
    padding: 12px 16px;
    border: 1px solid #cfd9de;
    border-radius: 12px;
    margin-top: 20px;
				margin-left: auto;
				margin-right: auto;
				background-color: white;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    max-width: max-content;
  }

  .tweet-container > #nonjsonview {
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;

  }

  .tweet-author {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding-bottom: 0.75rem;
  }

  .tweet-author-profile-image img {
    width: 48px;
    max-width: 48px;
    height: 48px;
    max-height: 48px;
    overflow: hidden;
    border-radius: 50%;
    margin-right: 5px;
  }

  .tweet-author-info {
    display: flex;
    flex-direction: column;
  }

  .tweet-author-name {
    font-weight: bold;
  }

  .tweet-content {
    font-size: 1.25rem;
  }

			.tweet-image {
				width: 100%;
				height: auto;
				margin-top: 12px;
				border-radius: 12px;
			}

			.embedded-tweet-container {
				box-sizing: border-box;
				margin-top: 12px;
				padding: 12px;
				border: 1px solid #cfd9de;
    border-radius: 12px;
				background-color: white;
				max-width: 100%;
			}
			.date {
				font-size: 0.75rem;
				color: #657786;
				margin-top: 12px;
			}
			.date a {
				color: #657786;
				text-decoration: none;
			}
			.date a:hover {
				text-decoration: underline;
			}
  .on {
    display: block;
  }
  .off {
    display: none;
  }
</style>
</head>
<body>
<div class="tweet-container on">
<div id="nonjsonview">
  <div class="tweet-author">
  <div class="tweet-author-profile-image">

  </div>
  <div class="tweet-author-info">
  <div class="tweet-author-name">
  Cream Cheese
  </div>
  <div class="tweet-author-username">

  </div>
  </div>
  <div class="tweet-content">
  “我们太迷恋结尾了。这个世界有那么多伟大的生命和美好的爱可以见证和体验，但只要结局不尽如人意，我们立刻觉得这是悲剧。或者正好相反，只要结局有一刻的救赎，一生的不公和痛苦都可以忽略不计。”

  <p class="date">

</div>
</div>
<script>
var dateString = "2025-01-17T16:57:02.000Z";
  var date = new Date(dateString);
  var currentURL = window.location.href;
  document.querySelector("#parentdate").innerText = date;
  document.querySelector("#parentdate").href = currentURL;
</script>
